<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation MapTiler</title>
</head>
<body>
    <label for="inputKota">Cari Lokasi: </label>
    <input type="text" id="inputKota" placeholder="Contoh: Jakarta" value="Jakarta">
    <button onclick="cariLokasi()">Cari</button>
    <br><br>
    <p><strong>Lokasi (Input):</strong> <span id="lokasi">-</span></p>
    <p><strong>Negara:</strong> <span id="negara">-</span></p>
    <p><strong>Provinsi:</strong> <span id="provinsi">-</span></p>
    <p><strong>Kecamatan:</strong> <span id="kecamatan">-</span></p>
    <p><strong>Longitude:</strong> <span id="longitude">-</span></p>
    <p><strong>Latitude:</strong> <span id="latitude">-</span></p>
</body>
</html>
