<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation MapTiler</title>
</head>
<body>
    <label for="inputKota">Cari Lokasi: </label>
    <input type="text" id="inputKota" placeholder="Contoh: Jakarta" value="Jakarta">
    <button onclick="cariLokasi()">Cari</button>
    <br><br>
    <p><strong>Lokasi (Input):</strong> <span id="lokasi">-</span></p>
    <p><strong>Negara:</strong> <span id="negara">-</span></p>
    <p><strong>Provinsi:</strong> <span id="provinsi">-</span></p>
    <p><strong>Kecamatan:</strong> <span id="kecamatan">-</span></p>
    <p><strong>Longitude:</strong> <span id="longitude">-</span></p>
    <p><strong>Latitude:</strong> <span id="latitude">-</span></p>

    <script>
        function cariLokasi() {
            const inputKota = document.getElementById("inputKota").value;

            fetch(`/api/lokasi?kota=${encodeURIComponent(inputKota)}`)
                .then(response => {
                    if (!response.ok) throw new Error("Gagal mengambil data");
                    return response.json();
                })
                .then(data => {
                    console.log("Data diterima:", data);

                    document.getElementById("lokasi").innerText = data.kota;
                    document.getElementById("negara").innerText = data.negara;
                    document.getElementById("provinsi").innerText = data.provinsi;
                    document.getElementById("kecamatan").innerText = data.kecamatan;
                    document.getElementById("longitude").innerText = data.longitude;
                    document.getElementById("latitude").innerText = data.latitude;
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Lokasi tidak ditemukan atau terjadi kesalahan server.");
                });
        }

        window.onload = cariLokasi;
    </script>

</body>
</html>
